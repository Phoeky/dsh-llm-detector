      <text x="1290" y="580" text-anchor="end" fill="#94a3b8">80.9%</text>
      <rect x="344" y="588" width="946" height="4" rx="2" fill="#162033"/>
      <rect x="344" y="588" width="765" height="4" rx="2" fill="url(#bar)"/>

      <text x="344" y="620" fill="#e2e8f0">deepseek-v4.1-flash</text>
      <text x="1290" y="620" text-anchor="end" fill="#94a3b8">14.4%</text>
      <rect x="344" y="628" width="946" height="4" rx="2" fill="#162033"/>
      <rect x="344" y="628" width="136" height="4" rx="2" fill="#38bdf8"/>

      <text x="344" y="660" fill="#e2e8f0">gpt-5.5</text>
      <text x="1290" y="660" text-anchor="end" fill="#94a3b8">1.5%</text>
      <rect x="344" y="668" width="946" height="4" rx="2" fill="#162033"/>
      <rect x="344" y="668" width="18" height="4" rx="2" fill="#38bdf8"/>
