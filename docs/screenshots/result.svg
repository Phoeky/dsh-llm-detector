<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Model fingerprint panel, result state illustration, dark theme">
  <defs>
    <linearGradient id="button2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#111111"/>
  <g font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="268" height="900" fill="#161616" stroke="#2a2a2a"/>
    <text x="24" y="46" fill="#8a8a8a" font-size="13" letter-spacing="1">DEEPSEEK HARNESS</text>
    <rect x="18" y="70" width="232" height="38" rx="10" fill="#1e1e1e" stroke="#2c2c2c"/>
    <circle cx="40" cy="89" r="8" fill="#3a3a3a"/>
    <rect x="58" y="83" width="120" height="11" rx="5" fill="#3a3a3a"/>
    <g fill="#7a7a7a" font-size="13">
      <text x="64" y="146">对话</text>
      <text x="64" y="182">Workspaces</text>
    </g>
    <g fill="#4f4f4f">
      <rect x="34" y="132" width="16" height="16" rx="4"/>
      <rect x="34" y="168" width="16" height="16" rx="4"/>
    </g>
    <rect x="34" y="230" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="241" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="255" fill="#9a9a9a" font-size="13">Plugins</text>
    <rect x="34" y="280" width="200" height="40" rx="10" fill="#232323" stroke="#3f3f3f"/>
    <rect x="46" y="291" width="18" height="18" rx="5" fill="none" stroke="#ededed" stroke-width="1.6"/>
    <circle cx="55" cy="302" r="3.4" fill="#ededed"/>
    <text x="76" y="305" fill="#f2f2f2" font-size="13" font-weight="600">模型指纹</text>
    <rect x="34" y="330" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="341" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="355" fill="#9a9a9a" font-size="13">Schedules</text>
    <rect x="34" y="380" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="391" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="405" fill="#9a9a9a" font-size="13">CodeArts</text>

    <text x="320" y="86" fill="#f4f4f4" font-size="26" font-weight="650">模型指纹检测</text>
    <rect x="1290" y="60" width="110" height="34" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="1314" y="82" fill="#cfcfcf" font-size="13">返回对话</text>

    <!-- form (compact, already filled) -->
    <rect x="320" y="110" width="1090" height="120" rx="14" fill="#1b1b1b" stroke="#2c2c2c"/>
    <g>
      <rect x="344" y="132" width="184" height="34" rx="8" fill="#232323" stroke="#373737"/>
      <text x="358" y="154" fill="#ededed" font-size="13">自定义</text>
      <rect x="544" y="132" width="224" height="34" rx="8" fill="#232323" stroke="#373737"/>
      <text x="558" y="154" fill="#ededed" font-size="13">deepseek-v4.1-flash-1017</text>
      <rect x="784" y="132" width="72" height="34" rx="8" fill="#232323" stroke="#373737"/>
      <text x="816" y="154" fill="#ededed" font-size="13">1</text>
      <rect x="872" y="132" width="72" height="34" rx="8" fill="#232323" stroke="#373737"/>
      <text x="904" y="154" fill="#ededed" font-size="13">3</text>
      <rect x="960" y="132" width="180" height="34" rx="8" fill="#232323" stroke="#373737"/>
      <text x="974" y="154" fill="#ededed" font-size="13">Low</text>
      <rect x="344" y="180" width="112" height="34" rx="8" fill="url(#button2)"/>
      <text x="368" y="202" fill="#111111" font-size="13" font-weight="700">重新检测</text>
    </g>

    <!-- summary card -->
    <rect x="320" y="250" width="1090" height="106" rx="14" fill="#1b1b1b" stroke="#2c2c2c"/>
    <text x="344" y="292" fill="#f4f4f4" font-size="24" font-weight="650">deepseek-v4.1-flash-1017</text>
    <text x="700" y="292" fill="#ededed" font-size="22" font-weight="700">80.9%</text>
    <text x="344" y="318" fill="#9a9a9a" font-size="12">自定义/deepseek-v4.1-flash-1017 · 最常见候选 1/1 · 可评分轮次 1</text>
    <text x="344" y="338" fill="#7a7a7a" font-size="12">参考库内相对置信度，非身份证明</text>

    <!-- round card -->
    <rect x="320" y="372" width="1090" height="436" rx="14" fill="#1b1b1b" stroke="#2c2c2c"/>
    <text x="344" y="404" fill="#f4f4f4" font-size="15" font-weight="600">第 1 轮 · deepseek-v4.1-flash-1017</text>
    <text x="710" y="404" fill="#9a9a9a" font-size="12">有效样本 3/3</text>
    <text x="1290" y="404" text-anchor="end" fill="#ededed" font-size="18" font-weight="700">80.9%</text>
    <text x="1290" y="422" text-anchor="end" fill="#7a7a7a" font-size="11">参考库内相对置信度</text>

    <g>
      <rect x="344" y="436" width="332" height="76" rx="10" fill="#232323" stroke="#333333"/>
      <text x="358" y="460" fill="#ededed" font-size="12" font-weight="600">1. 完成</text>
      <text x="358" y="480" fill="#9a9a9a" font-size="12">308 / 308</text>
      <rect x="692" y="436" width="332" height="76" rx="10" fill="#232323" stroke="#333333"/>
      <text x="706" y="460" fill="#ededed" font-size="12" font-weight="600">2. 完成</text>
      <text x="706" y="480" fill="#9a9a9a" font-size="12">325 / 325</text>
      <rect x="1040" y="436" width="332" height="76" rx="10" fill="#232323" stroke="#333333"/>
      <text x="1054" y="460" fill="#ededed" font-size="12" font-weight="600">3. 完成</text>
      <text x="1054" y="480" fill="#9a9a9a" font-size="12">323 / 323</text>
    </g>

    <text x="344" y="548" fill="#7a7a7a" font-size="11" letter-spacing="1">候选排名</text>

    <g font-size="13">
      <text x="344" y="580" fill="#ededed">deepseek-v4.1-flash-1017</text>
      <text x="1290" y="580" text-anchor="end" fill="#9a9a9a">80.9%</text>
      <rect x="344" y="588" width="946" height="4" rx="2" fill="#2a2a2a"/>
      <rect x="344" y="588" width="765" height="4" rx="2" fill="url(#bar2)"/>

      <text x="344" y="620" fill="#ededed">deepseek-v4.1-flash</text>
      <text x="1290" y="620" text-anchor="end" fill="#9a9a9a">14.4%</text>
      <rect x="344" y="628" width="946" height="4" rx="2" fill="#2a2a2a"/>
      <rect x="344" y="628" width="136" height="4" rx="2" fill="#b5b5b5"/>

      <text x="344" y="660" fill="#ededed">gpt-5.5</text>
      <text x="1290" y="660" text-anchor="end" fill="#9a9a9a">1.5%</text>
      <rect x="344" y="668" width="946" height="4" rx="2" fill="#2a2a2a"/>
      <rect x="344" y="668" width="18" height="4" rx="2" fill="#8a8a8a"/>
    </g>

    <rect x="344" y="700" width="1028" height="86" rx="10" fill="#181818" stroke="#2a2a2a"/>
    <text x="360" y="726" fill="#9a9a9a" font-size="12">序列检查 ▾</text>
    <text x="360" y="752" fill="#7a7a7a" font-size="12">像语言模型回答 · lag-1 自相关、相邻小步占比与 1–3 位内相近数对均在界限内</text>
    <text x="360" y="772" fill="#5f5f5f" font-size="11">Token 用量：in 4,120 / out 3,610（示例数值）</text>

    <text x="320" y="852" fill="#5f5f5f" font-size="12">这张图是界面示意图，用于说明结果区布局与文案；真实界面以 DSH 中的插件页为准。</text>
  </g>
</svg>