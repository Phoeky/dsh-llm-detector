    <rect x="344" y="700" width="1028" height="86" rx="10" fill="#0d1626" stroke="#1b2537"/>
    <text x="360" y="726" fill="#94a3b8" font-size="12">序列检查 ▾</text>
    <text x="360" y="752" fill="#7c8ba1" font-size="12">像语言模型回答 · lag-1 自相关、相邻小步占比与 1–3 位内相近数对均在界限内</text>
    <text x="360" y="772" fill="#52627a" font-size="11">Token 用量：in 4,120 / out 3,610（示例数值）</text>

    <text x="320" y="852" fill="#52627a" font-size="12">这张图是界面示意图，用于说明结果区布局与文案；真实界面以 DSH 中的插件页为准。</text>
