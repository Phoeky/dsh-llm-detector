<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Model fingerprint panel, empty state illustration, dark theme">
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#111111"/>
  <g font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
    <!-- sidebar -->
    <rect x="0" y="0" width="268" height="900" fill="#161616" stroke="#2a2a2a"/>
    <text x="24" y="46" fill="#8a8a8a" font-size="13" letter-spacing="1">DEEPSEEK HARNESS</text>
    <rect x="18" y="70" width="232" height="38" rx="10" fill="#1e1e1e" stroke="#2c2c2c"/>
    <circle cx="40" cy="89" r="8" fill="#3a3a3a"/>
    <rect x="58" y="83" width="120" height="11" rx="5" fill="#3a3a3a"/>

    <g fill="#7a7a7a" font-size="13">
      <text x="64" y="146">对话</text>
      <text x="64" y="182">Workspaces</text>
    </g>
    <g fill="#4f4f4f">
      <rect x="34" y="132" width="16" height="16" rx="4"/>
      <rect x="34" y="168" width="16" height="16" rx="4"/>
    </g>

    <!-- icons column -->
    <rect x="34" y="230" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="241" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="255" fill="#9a9a9a" font-size="13">Plugins</text>

    <rect x="34" y="280" width="200" height="40" rx="10" fill="#232323" stroke="#3f3f3f"/>
    <rect x="46" y="291" width="18" height="18" rx="5" fill="none" stroke="#ededed" stroke-width="1.6"/>
    <circle cx="55" cy="302" r="3.4" fill="#ededed"/>
    <text x="76" y="305" fill="#f2f2f2" font-size="13" font-weight="600">模型指纹</text>

    <rect x="34" y="330" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="341" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="355" fill="#9a9a9a" font-size="13">Schedules</text>

    <rect x="34" y="380" width="200" height="40" rx="10" fill="#1a1a1a"/>
    <rect x="46" y="391" width="18" height="18" rx="5" fill="#3a3a3a"/>
    <text x="76" y="405" fill="#9a9a9a" font-size="13">CodeArts</text>

    <text x="24" y="856" fill="#5a5a5a" font-size="12">Settings</text>

    <!-- main -->
    <text x="320" y="86" fill="#f4f4f4" font-size="26" font-weight="650">模型指纹检测</text>
    <text x="320" y="118" fill="#9a9a9a" font-size="14">让模型写一串“随机”整数，比较数值与序列分布，判断这个渠道背后最像参考库中的哪个模型。</text>
    <rect x="1290" y="60" width="110" height="34" rx="8" fill="#1e1e1e" stroke="#333333"/>
    <text x="1314" y="82" fill="#cfcfcf" font-size="13">返回对话</text>

    <!-- form card -->
    <rect x="320" y="150" width="1090" height="206" rx="14" fill="#1b1b1b" stroke="#2c2c2c"/>
    <g fill="#9a9a9a" font-size="12">
      <text x="344" y="182">渠道</text>
      <text x="544" y="182">模型</text>
      <text x="784" y="182">轮数</text>
      <text x="872" y="182">并发</text>
      <text x="960" y="182">思考强度</text>
    </g>
    <g>
      <rect x="344" y="192" width="184" height="36" rx="8" fill="#232323" stroke="#373737"/>
      <text x="358" y="215" fill="#ededed" font-size="13">自定义</text>
      <text x="512" y="215" fill="#7a7a7a" font-size="12">▾</text>

      <rect x="544" y="192" width="224" height="36" rx="8" fill="#232323" stroke="#373737"/>
      <text x="558" y="215" fill="#ededed" font-size="13">deepseek-v4.1-flash-1017</text>
      <text x="752" y="215" fill="#7a7a7a" font-size="12">▾</text>

      <rect x="784" y="192" width="72" height="36" rx="8" fill="#232323" stroke="#373737"/>
      <text x="816" y="215" fill="#ededed" font-size="13">1</text>

      <rect x="872" y="192" width="72" height="36" rx="8" fill="#232323" stroke="#373737"/>
      <text x="904" y="215" fill="#ededed" font-size="13">3</text>

      <rect x="960" y="192" width="180" height="36" rx="8" fill="#232323" stroke="#373737"/>
      <text x="974" y="215" fill="#ededed" font-size="13">模型默认</text>
      <text x="1122" y="215" fill="#7a7a7a" font-size="12">▾</text>
    </g>

    <rect x="344" y="248" width="112" height="36" rx="8" fill="url(#button)"/>
    <text x="368" y="271" fill="#111111" font-size="13" font-weight="700">开始检测</text>
    <rect x="472" y="257" width="16" height="16" rx="4" fill="#181818" stroke="#ededed" stroke-width="1.6"/>
    <path d="M476 265l3 3 6-6" fill="none" stroke="#ededed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="498" y="270" fill="#cfcfcf" font-size="12">显示提示词与原始回答</text>

    <text x="344" y="310" fill="#7a7a7a" font-size="12">每轮 3 次真实模型调用、每次约 300 个整数，默认并发 3，按渠道计费。遇到限流可在失败样本上单独重试。</text>
    <text x="344" y="332" fill="#7a7a7a" font-size="12">参考库：76 models · 2026-11-23T06:25:02.164646+00:00</text>

    <!-- collapsed cards -->
    <rect x="320" y="376" width="1090" height="52" rx="12" fill="#1b1b1b" stroke="#2c2c2c"/>
    <text x="344" y="408" fill="#ededed" font-size="14" font-weight="600">两种使用方式</text>
    <text x="1378" y="408" fill="#7a7a7a" font-size="13">▾</text>

    <rect x="320" y="442" width="1090" height="52" rx="12" fill="#1b1b1b" stroke="#2c2c2c"/>
    <text x="344" y="474" fill="#ededed" font-size="14" font-weight="600">如何解读结果</text>
    <text x="1378" y="474" fill="#7a7a7a" font-size="13">▾</text>

    <rect x="320" y="518" width="1090" height="150" rx="12" fill="#181818" stroke="#2a2a2a"/>
    <text x="800" y="578" text-anchor="middle" fill="#8a8a8a" font-size="14">先选择渠道与模型，再点“开始检测”；也可以在对话里让助手检测。</text>
    <text x="800" y="606" text-anchor="middle" fill="#5f5f5f" font-size="12">排名只在参考库内比较：库外模型也会得到“最像”的候选，置信度不是身份证明。</text>

    <text x="320" y="712" fill="#5f5f5f" font-size="12">这张图是界面示意图，用于说明布局与文案；真实界面以 DSH 中的插件页为准。</text>
  </g>
</svg>